<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Моя первая визитка</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue',
          sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .card {
        background-color: #1e293b;
        width: 100%;
        max-width: 360px;
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        transition: 0.3s;
      }

      .card:hover {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        scale: 1.1;
      }

      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #38bdf8;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 6px;
      }

      .role {
        font-size: 14px;
        color: #94a3b8;
        margin-bottom: 24px;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .link-item {
        display: block;
        background-color: #334155;
        color: white;
        text-decoration: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 500;
        transition: 0.3s;
      }

      .link-item:hover {
        background-color: #2563eb;
      }
    </style>
  </head>
  <body>
    <!-- <header></header> -->
    <main class="card">
      <img
        class="avatar"
        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200"
        alt="Абдыкапаров Санатбек ALT"
      />
      <h1>Абдыкапаров Санатбек</h1>
      <!-- <h2>Абдыкапаров Санатбек</h2>
      <h3>Абдыкапаров Санатбек</h3>
      <h4>Абдыкапаров Санатбек</h4>
      <h5>Абдыкапаров Санатбек</h5>
      <h6>Абдыкапаров Санатбек</h6> -->
      <p class="role">Студент 1 курса | Будущий фронтендер</p>

      <div class="links">
        <a class="link-item" href="https://github.com">Мой GitHub</a>
        <a class="link-item" href="https://t.me">Telegram канал</a>
        <a class="link-item" href="#">Моё портфолио</a>
      </div>
    </main>
    <!-- <footer></footer> -->
  </body>
</html>
